name: atlasium-gitlab

services:
  gitlab:
    image: ${GITLAB_OMNIBUS_IMAGE:-gitlab/gitlab-ce:latest}
    container_name: atlasium-gitlab
    hostname: git.atlasium.info
    restart: unless-stopped
    shm_size: "256m"
    ports:
      - "${ATLASIUM_GITLAB_HTTP_PORT:-8081}:80"
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      GITLAB_EXTERNAL_URL: ${GITLAB_EXTERNAL_URL}
      ATLASIUM_OIDC_CLIENT_ID: ${ATLASIUM_OIDC_CLIENT_ID}
      ATLASIUM_OIDC_CLIENT_SECRET: ${ATLASIUM_OIDC_CLIENT_SECRET}
      GITLAB_ROOT_EMAIL: ${GITLAB_ROOT_EMAIL:-root@git.atlasium.info}
      GITLAB_ROOT_PASSWORD: ${GITLAB_INITIAL_ROOT_PASSWORD:?set GITLAB_INITIAL_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url ENV['GITLAB_EXTERNAL_URL']
        letsencrypt['enable'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'Atlasium',
            args: {
              name: 'openid_connect',
              scope: ['openid', 'profile', 'email'],
              response_type: 'code',
              issuer: ENV['APP_BASE_URL'].to_s.sub(%r{/*$}, '') + '/api/auth/oidc',
              discovery: true,
              uid_field: 'sub',
              pkce: true,
              client_auth_method: 'basic',
              client_options: {
                identifier: ENV['ATLASIUM_OIDC_CLIENT_ID'],
                secret: ENV['ATLASIUM_OIDC_CLIENT_SECRET'],
                redirect_uri: ENV['GITLAB_EXTERNAL_URL'].to_s.sub(%r{/*$}, '') + '/users/auth/openid_connect/callback'
              }
            }
          }
        ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/-/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m
    volumes:
      - ${ATLASIUM_GITLAB_ROOT:-/var/lib/atlasium/gitlab}/config:/etc/gitlab
      - ${ATLASIUM_GITLAB_ROOT:-/var/lib/atlasium/gitlab}/logs:/var/log/gitlab
      - ${ATLASIUM_GITLAB_ROOT:-/var/lib/atlasium/gitlab}/data:/var/opt/gitlab
