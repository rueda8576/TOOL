name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctoral_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doctoral_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doctoral_platform_test?schema=public
      JWT_SECRET: integration-secret-123
      APP_BASE_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      STORAGE_ROOT: ./storage
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Repo hygiene
        run: pnpm repo:check
      - name: Diagnose test environment
        run: |
          echo "NODE_ENV=${NODE_ENV:-<unset>}"
          pnpm --filter @doctoral/api exec which jest
          pnpm --filter @doctoral/worker exec which jest
          echo "DATABASE_URL=${DATABASE_URL}"
      - name: Prepare test database
        run: pnpm --filter @doctoral/db db:test:prepare
      - name: API aggregated coverage
        run: pnpm --filter @doctoral/api test:coverage
      - name: Worker coverage gate
        run: pnpm --filter @doctoral/worker test:coverage:gate
      - name: Build
        run: pnpm build
