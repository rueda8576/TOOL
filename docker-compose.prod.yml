name: atlasium

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: doctoral_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctoral_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

  api:
    image: ghcr.io/rueda8576/atlasium-api:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
      STORAGE_ROOT: /var/lib/atlasium/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - ${ATLASIUM_STORAGE_HOST_PATH:-/var/lib/atlasium/storage}:/var/lib/atlasium/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g

  migrate:
    image: ghcr.io/rueda8576/atlasium-api:${IMAGE_TAG:-main}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >
        PRISMA_CLI="$$(find /app/node_modules/.pnpm -path '*/node_modules/prisma/build/index.js' | head -n 1)";
        test -n "$$PRISMA_CLI";
        node "$$PRISMA_CLI" migrate deploy --schema packages/db/prisma/schema.prisma
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g

  web:
    image: ghcr.io/rueda8576/atlasium-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
    depends_on:
      - api
    ports:
      - "3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g

  worker:
    image: ghcr.io/rueda8576/atlasium-worker:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
      STORAGE_ROOT: /var/lib/atlasium/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${WORKER_HEALTH_PORT:-4100}/health\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ${ATLASIUM_STORAGE_HOST_PATH:-/var/lib/atlasium/storage}:/var/lib/atlasium/storage

volumes:
  postgres_data:
