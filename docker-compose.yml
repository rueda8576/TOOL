services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: doctoral_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
      STORAGE_ROOT: /var/lib/atlasium/storage
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    volumes:
      - ${ATLASIUM_STORAGE_HOST_PATH:-./storage}:/var/lib/atlasium/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
    depends_on:
      - api
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${ATLASIUM_DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/doctoral_platform?schema=public}
      REDIS_URL: ${ATLASIUM_DOCKER_REDIS_URL:-redis://redis:6379}
      STORAGE_ROOT: /var/lib/atlasium/storage
    depends_on:
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${WORKER_HEALTH_PORT:-4100}/health\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ${ATLASIUM_STORAGE_HOST_PATH:-./storage}:/var/lib/atlasium/storage

volumes:
  postgres_data:
